<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cari chord dan lirik lagu favoritmu dengan mudah. Fitur transpose dan auto scroll untuk latihan bermain gitar.">
  <title>ChordPlayer - Cari Chord & Lirik Lagu</title>
  <link rel="icon" href="asset/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-home">
  <header>
    <div class="header-inner">
      <div class="header-left">
        <button id="navToggle" class="nav-toggle" aria-label="Buka menu navigasi" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <span class="logo">ChordPlayer</span>
      </div>
      <div class="header-center">
        <a href="index.html" class="nav-link active">Home</a>
        <button type="button" class="nav-link nav-btn" id="btnOpenMetronomeTop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Metronom
        </button>
      </div>
      <div class="header-right">
        <span class="header-tagline">Cari chord. Mainkan musik.</span>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </header>

  <!-- Menu dropdown mobile -->
  <nav class="site-menu" id="siteMenu" aria-label="Menu utama">
    <a href="index.html" class="nav-link active">Home</a>
  </nav>

  <main class="container">
    <section class="search-section">
      <h2>Cari Chord Lagu</h2>
      <p class="search-subtitle">Temukan chord dan lirik lagu favoritmu</p>
      <form class="search-box" id="searchForm" role="search">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input
          type="text"
          id="searchInput"
          placeholder="Cari judul lagu atau nama artis..."
          autocomplete="off"
        />
        <button type="button" id="btnClearSearch" class="btn-clear-search" aria-label="Hapus pencarian" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button type="submit" id="btnSearch" class="btn-search" aria-label="Cari">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </form>
      <div class="search-filter">
        <button class="filter-chip active" data-filter="all">Semua</button>
        <button class="filter-chip" data-filter="title">Judul</button>
        <button class="filter-chip" data-filter="artist">Artis</button>
        <button class="filter-chip" data-filter="favorite" id="chipFavorite">
          <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Favorit
        </button>
      </div>
    </section>

    <section class="song-section" id="daftar-lagu">
      <div class="section-header">
        <h3>Daftar Lagu</h3>
        <span id="songCount" class="badge">0 lagu</span>
      </div>

      <div id="songList" class="song-list"></div>
      <div id="songPagination" class="song-pagination" aria-label="Pagination daftar lagu"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 ChordPlayer App — Portofolio Learning Project</p>
  </footer>

  <!-- Bottom navigation (mobile) -->
  <nav class="bottom-nav" aria-label="Navigasi bawah">
    <div class="bottom-nav-inner">
      <a href="index.html" class="bottom-nav-item active" aria-current="page" id="bnavHome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Beranda</span>
      </a>
      <a href="index.html#daftar-lagu" class="bottom-nav-item" id="bnavSongs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Lagu</span>
      </a>
      <button type="button" class="bottom-nav-item" id="bnavFavorites" title="Lihat lagu favorit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Favorit</span>
      </button>
      <button type="button" class="bottom-nav-item" id="bnavMetronome" title="Buka Metronom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Metronom</span>
      </button>
    </div>
  </nav>

  <!-- Modal Metronom Interaktif -->
  <dialog id="metronomeDialog" class="metronome-dialog" aria-labelledby="metroTitle">
    <div class="metronome-card">
      <div class="metronome-header">
        <div class="metronome-title-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="metro-icon"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <h3 id="metroTitle">Metronom Latihan</h3>
        </div>
        <button type="button" class="btn-close-metro" id="btnCloseMetronome" aria-label="Tutup metronom">✕</button>
      </div>

      <!-- Visual Beat Indicator -->
      <div class="metro-visualizer" id="metroVisualizer" aria-live="off">
        <span class="beat-dot active" data-beat="1">1</span>
        <span class="beat-dot" data-beat="2">2</span>
        <span class="beat-dot" data-beat="3">3</span>
        <span class="beat-dot" data-beat="4">4</span>
      </div>

      <!-- BPM Display & Controls -->
      <div class="metro-bpm-display">
        <span class="bpm-number" id="metroBpmVal">100</span>
        <span class="bpm-unit">BPM</span>
        <span class="bpm-tempo-name" id="metroTempoName">Andante</span>
      </div>

      <div class="metro-slider-wrap">
        <button type="button" class="btn-metro-step" id="btnBpmMinus" aria-label="Kurangi 1 BPM">−</button>
        <input type="range" id="metroBpmSlider" min="40" max="240" value="100" class="metro-range" aria-label="Atur BPM">
        <button type="button" class="btn-metro-step" id="btnBpmPlus" aria-label="Tambah 1 BPM">+</button>
      </div>

      <!-- Time signature & Tap tempo -->
      <div class="metro-controls-row">
        <div class="metro-select-wrap">
          <label for="metroTimeSig">Ketukan:</label>
          <select id="metroTimeSig">
            <option value="2">2/4</option>
            <option value="3">3/4</option>
            <option value="4" selected>4/4</option>
            <option value="6">6/8</option>
          </select>
        </div>
        <button type="button" class="btn-tap-tempo" id="btnTapTempo">Tap Tempo</button>
      </div>

      <!-- Play & Volume -->
      <div class="metro-action-row">
        <button type="button" class="btn-metro-play" id="btnToggleMetronome">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" id="metroPlayIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="metroPlayText">Mulai</span>
        </button>
      </div>
    </div>
  </dialog>

  <!-- Container untuk toast notification -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
