<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lihat chord dan lirik lengkap. Transpose nada dan gunakan auto scroll saat bermain gitar.">
  <title>ChordPlayer - Detail Lagu</title>
  <link rel="icon" href="asset/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <nav>
    <div class="logo">ChordPlayer</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button></li>
    </ul>
  </nav>
</header>
  <main class="container">

  <!-- Tombol kembali (smart back — pertahankan state search) -->
  <a href="index.html" class="btn-back" id="btnBack">← Kembali</a>

  <!-- Info lagu -->
  <section class="meta-data">
    <h2 id="songTitle">-</h2>
    <p class="song-artist" id="songArtist">-</p>
  </section>

  <!-- Tombol kontrol -->
  <section class="control-panel">
    <button class="btn-control" id="btnTransposeUp">▲ Transpose Up</button>
    <span id="transposeDisplay" class="transpose-display">Transpose: 0</span>
    <button class="btn-control" id="btnTransposeDown">▼ Transpose Down</button>
    <button class="btn-control btn-reset-transpose" id="btnResetTranspose">↺ Reset</button>
    <button class="btn-control btn-scroll" id="btnAutoScroll">▶ Auto Scroll</button>
    <label class="scroll-speed-control" for="scrollSpeed">
      <span>Kecepatan</span>
      <select id="scrollSpeed" aria-label="Kecepatan auto-scroll">
        <option value="0.5">0,5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1,5×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
      </select>
    </label>
    <button class="btn-control btn-copy" id="btnCopyChord">📋 Copy Chord</button>
    <button class="btn-control btn-share" id="btnShareSong">🔗 Bagikan</button>
    <button class="btn-control btn-print" id="btnPrintChord">🖨️ Print</button>
    <button class="btn-control btn-fullscreen" id="btnFullscreen" aria-pressed="false">⛶ Fullscreen</button>
  </section>

  <!-- Header ini hanya muncul di kertas, disembunyikan di layar -->
  <div class="print-header">
    <div class="print-brand">ChordPlayer</div>
    <div class="print-divider"></div>
  </div>

  <!-- Diagram chord gitar aktif -->
  <section id="chordDiagramPanel" class="chord-diagram-panel" aria-live="polite">
    <div class="chord-diagram-heading">
      <div>
        <p class="section-kicker">Fingering gitar</p>
        <h3 id="chordDiagramTitle">Chord aktif</h3>
      </div>
      <span class="chord-diagram-hint">Ikuti chord yang sedang terlihat</span>
    </div>
    <div id="chordDiagram" class="chord-diagram" aria-label="Diagram fingering chord gitar"></div>
  </section>

  <!-- Rekomendasi capo -->
  <section id="capoRecommendation" class="capo-recommendation" aria-live="polite">
    <div class="capo-icon" aria-hidden="true">♯</div>
    <div class="capo-content">
      <p class="section-kicker">Saran bermain</p>
      <h3 id="capoTitle">Rekomendasi capo</h3>
      <p id="capoDescription">Capo 0 — tanpa capo untuk posisi transpose saat ini.</p>
    </div>
    <span id="capoBadge" class="capo-badge">Capo 0</span>
  </section>

  <!-- Area chord & lirik -->
  <pre id="lyricsArea" class="lyrics-area">Memuat chord...</pre>

  </main>
  <footer>© 2026 ChordPlayer App</footer>

  <!-- Container untuk toast notification -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
